version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dashboard_db
    environment:
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: dashboard_pass_2024
      POSTGRES_DB: project_dashboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard_user -d project_dashboard']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
